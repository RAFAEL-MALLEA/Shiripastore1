{% extends "venta/base.html" %}
{% block titulo %}Categorías{% endblock %}
{% block contenido %}
<section class="container mt-4">
  <h2 class="mb-3">Categorías</h2>
  <div class="d-grid gap-2 d-md-flex justify-content-md-end mb-3">
    <a href="{% url 'categoriasAdd' %}" class="btn btn-outline-success">Agregar categoría</a>
  </div>
  <table class="table table-light table-hover">
    <tbody>
      {% for tmp in categorias %}
      <tr>
        <td class="fs-5 align-middle">{{ tmp.categoria }}</td>
        <td class="text-end">
          <a class="btn btn-outline-warning" href="{% url 'categorias_edit' pk=tmp.Id_categoria %}">Modificar</a>
          <a class="btn btn-outline-danger" href="{% url 'categorias_del' pk=tmp.Id_categoria %}"
             onclick="return confirm('¿Eliminar esta categoría?');">Eliminar</a>
        </td>
      </tr>
      {% empty %}
      <tr><td>No hay categorías registradas.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <a class="btn btn-outline-primary" href="{% url 'administrador' %}">Volver</a>
</section>
{% endblock %}
